<style>

.page{flex:1;overflow:auto;background:var(--win);color:var(--ink);min-height:0}

.center{display:flex;flex-direction:column;align-items:center;padding:8vh 16px 24px}

#apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px;width:min(760px,100%)}

</div>
<div id="menu"><div class="lh"><input id="lq" placeholder="Search apps" aria-label="Search apps"></div><div id="apps">
  <button data-app="calc"><span class="mi" data-ic="calc"></span>Calculator</button>
  <button data-app="browser"><span class="mi" data-ic="browser"></span>Browser</button>
  <button data-app="ai"><span class="mi" data-ic="ai"></span>AI</button>
  </div><div class="lf"><button id="uinfo"></button><button id="theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg> Theme</button></div>
</div>

</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const desk=$('#desk'),tbs=$('#tbs');
const IC={
calc:'<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#2b2f36"/><rect x="8" y="8" width="32" height="12" rx="3" fill="#9be7a5"/><g fill="#f1f3f4"><circle cx="14" cy="28" r="3.2"/><circle cx="24" cy="28" r="3.2"/><circle cx="34" cy="28" r="3.2" fill="#ff9f43"/><circle cx="14" cy="38" r="3.2"/><circle cx="24" cy="38" r="3.2"/><circle cx="34" cy="38" r="3.2" fill="#ff9f43"/></g></svg>',
browser:'<div style="background:#fff;display:grid;place-items:center"><div style="width:72%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from -60deg,#ea4335 0 120deg,#fbbc05 120deg 240deg,#34a853 240deg);display:grid;place-items:center"><div style="width:42%;aspect-ratio:1;border-radius:50%;background:#4285f4;box-shadow:0 0 0 12% #fff;outline:3px solid #fff"></div></div></div>',
ai:'<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#d97757"/><g stroke="#faf6f0" stroke-width="3.4" stroke-linecap="round">'+[...Array(12)].map((_,i)=>{const a=i*Math.PI/6,r=i%2?11:15;return `<line x1="${24+4*Math.cos(a)}" y1="${24+4*Math.sin(a)}" x2="${24+r*Math.cos(a)}" y2="${24+r*Math.sin(a)}"/>`}).join('')+'</g></svg>'};
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=IC[e.dataset.ic]);
IC.yt='<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#fff"/><rect x="6" y="12" width="36" height="24" rx="8" fill="#ff0033"/><path d="M20 18l10 6-10 6z" fill="#fff"/></svg>';
let z=10,n=0;const wins={};
const small=()=>innerWidth<700;

function openApp(app){
  const id='w'+(++n),w=document.createElement('div');
  w.className='win';w.id=id;
  const W=Math.min(innerWidth-20,app==='calc'?340:860),H=Math.min(innerHeight-90,app==='calc'?640:560);
  w.style.cssText=`width:${W}px;height:${H}px;left:${Math.max(10,(innerWidth-W)/2+n*18-40)}px;top:${50+n*18}px;z-index:${++z}`;
  const name='<span class="mi">'+IC[app]+'</span> '+{calc:'Calculator',browser:'Browser',ai:'AI',yt:'YouTube'}[app];
  w.innerHTML=`<div class="title"><b style="display:flex;align-items:center;gap:8px">${name}</b><button class="wb" data-a="min" aria-label="Minimize">–</button><button class="wb" data-a="max" aria-label="Maximize">▢</button><button class="wb x" data-a="x" aria-label="Close">✕</button></div><div class="body"></div>`;
  desk.appendChild(w);
  const tb=document.createElement('button');tb.className='tb';tb.innerHTML=name;tbs.appendChild(tb);
  wins[id]={w,tb};
  if(small())w.classList.add('max');
  tb.onclick=()=>{ if(w.classList.contains('min')){w.classList.remove('min');focus(id)} else if(w.style.zIndex==z){w.classList.add('min');tb.classList.remove('on')} else focus(id)};
  w.addEventListener('pointerdown',()=>focus(id));
  w.querySelector('.title').addEventListener('click',e=>{
    const a=e.target.dataset.a;if(!a)return;
    if(a==='x'){w.remove();tb.remove();delete wins[id]}
    if(a==='min'){w.classList.add('min');tb.classList.remove('on')}
    if(a==='max')w.classList.toggle('max');
  });
  drag(w);
  ({calc,browser,ai,yt:youtube})[app]($('.body',w),w);
  focus(id);
}
function focus(id){
  Object.values(wins).forEach(o=>o.tb.classList.remove('on'));
  const o=wins[id];if(!o)return;
  o.w.style.zIndex=++z;o.tb.classList.add('on');
}
function drag(w){
  const t=$('.title',w);let sx,sy,ox,oy,on=false;
  t.addEventListener('pointerdown',e=>{
    if(e.target.dataset.a||w.classList.contains('max'))return;
    on=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;t.setPointerCapture(e.pointerId)});
  t.addEventListener('pointermove',e=>{if(!on)return;
    w.style.left=ox+e.clientX-sx+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px'});
  t.addEventListener('pointerup',()=>on=false);
  t.addEventListener('dblclick',e=>{if(!e.target.dataset.a)w.classList.toggle('max')});
}
document.addEventListener('click',e=>{
  const pn=e.target.closest('[data-pin]');if(pn){const D=S.d,k=pn.dataset.k,a=pn.dataset.pin;D[k]=D[k].includes(a)?D[k].filter(x=>x!==a):[...D[k],a];save();rend();return}
  const b=e.target.closest('[data-app]');
  if(b){openApp(b.dataset.app);$('#menu').classList.remove('show');return}
  if(e.target.closest('#start')){tog();return}
  if(e.target.closest('#prof,#uinfo')){acct();return}
  if(e.target.id==='menu')$('#menu').classList.remove('show');
});
$('#theme').onclick=()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark'};
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('en',{day:'numeric',month:'short'})}
tick();setInterval(tick,20000);

/* ---------- Calculator ---------- */
const RATES={USD:1,EUR:.92,MXN:18,GBP:.78,JPY:150,CAD:1.36,BRL:5.4,COP:4000,ARS:1000};let ratesLive=false;
const UNITS={Length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},Weight:{kg:1,g:.001,lb:.45359237,oz:.028349523},Volume:{L:1,mL:.001,gal:3.785411784,taza:.2365882365}};
const FACT=n=>{n=Math.round(n);if(n<0||n>170)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
function calc(root,w){
  root.innerHTML='<div class="calc"><div class="cm"><button class="mb"></button><div class="mmenu"></div></div><div class="cmain"></div></div>';
  const mb=$('.mb',root),mm=$('.mmenu',root),main=$('.cmain',root);
  let mode='basic',e='',fresh=false,deg=true,hist,out;
  const NAMES={basic:'Basic',sci:'Scientific',conv:'Convert'};
  function setMode(m){mode=m;mb.textContent=NAMES[m]+' ▾';mm.classList.remove('show');if(m==='conv')conv();else pad()}
  mb.onclick=()=>{mm.innerHTML=Object.keys(NAMES).map(k=>`<button data-m="${k}"><span>${mode===k?'✓':''}</span><i>${{basic:'±',sci:'ƒ',conv:'⇄'}[k]}</i>${NAMES[k]}</button>`).join('');mm.classList.toggle('show')};
  mm.onclick=ev=>{const b=ev.target.closest('[data-m]');if(b)setMode(b.dataset.m)};
  function ev(s){
    let x=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/\be\b/g,'Math.E').replace(/√\(/g,'Math.sqrt(').replace(/sin\(/g,'SIN(').replace(/cos\(/g,'COS(').replace(/tan\(/g,'TAN(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/(\d+(?:\.\d+)?)!/g,'FACT($1)').replace(/%/g,'/100').replace(/\^/g,'**');
    const o=(x.match(/\(/g)||[]).length,c=(x.match(/\)/g)||[]).length;x+=')'.repeat(Math.max(0,o-c));
    if(!/^[\d+\-*/.()\s]*$/.test(x.replace(/Math\.(PI|E|sqrt|log10|log)|SIN|COS|TAN|FACT/g,'')))throw 0;
    const k=deg?Math.PI/180:1;
    return Function('SIN','COS','TAN','FACT','"use strict";return('+x+')')(a=>Math.sin(a*k),a=>Math.cos(a*k),a=>Math.tan(a*k),FACT);
  }
  const OP=['÷','×','−','+','^','%','!','x²','1/x','=','⌫','±','C'];
  function press(k){
    if(fresh&&!OP.includes(k))e='';
    fresh=false;
    if(k==='C'){e='';hist.textContent=''}
    else if(k==='⌫')e=e.slice(0,-1);
    else if(k==='±'){const m=e.match(/(-?[\d.]+)$/);if(m)e=e.slice(0,m.index)+(m[1][0]==='-'?m[1].slice(1):'-'+m[1])}
    else if(k==='x²')e+='^2';
    else if(k==='1/x'){if(e)e='1/('+e+')'}
    else if(k==='='){if(!e)return;try{let r=ev(e);if(!isFinite(r))throw 0;r=+r.toPrecision(12);hist.textContent=e+' =';e=String(r);fresh=true}catch{hist.textContent=e;e='Error';fresh=true}}
    else{
      if('÷×−+'.includes(k)&&(!e||e==='Error')&&k!=='−')return;
      if('÷×−+'.includes(k)&&'÷×−+'.includes(e.slice(-1)))e=e.slice(0,-1);
      if(e==='Error')e='';
      e+=k;
    }
    out.textContent=e||'0';
  }
  function pad(){
    main.innerHTML='<div class="disp"><small></small><div>0</div></div>'+(mode==='sci'?'<div class="sci"></div>':'')+'<div class="keys"></div>';
    hist=$('small',main);out=$('.disp div',main);
    const keys=$('.keys',main);
    ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].forEach(k=>{const b=document.createElement('button');b.textContent=k;if('C⌫%÷×−+'.includes(k))b.className='op';if(k==='=')b.className='eq';b.onclick=()=>press(k);keys.appendChild(b)});
    if(mode==='sci'){const s=$('.sci',main);['Deg','sin(','cos(','tan(','!','π','e','log(','ln(','x²','(',')','√(','^','1/x'].forEach(k=>{const b=document.createElement('button');b.textContent=k==='Deg'?(deg?'Deg':'Rad'):k;b.onclick=()=>{if(k==='Deg'){deg=!deg;b.textContent=deg?'Deg':'Rad'}else press(k)};s.appendChild(b)})}
    out.textContent=e||'0';
  }
  function conv(){
    main.innerHTML='<div class="cv"><select class="ct" aria-label="Category"></select><input class="cin2" type="number" inputmode="decimal" value="1" aria-label="Amount"><select class="cf" aria-label="De"></select><div class="sw">⇅</div><select class="cto" aria-label="A"></select><div class="cres">—</div><small class="cn"></small></div>';
    const ct=$('.ct',main),inp=$('.cin2',main),cf=$('.cf',main),cto=$('.cto',main),res=$('.cres',main),cn=$('.cn',main);
    ct.innerHTML=['Currency',...Object.keys(UNITS),'Temperature'].map(c=>`<option>${c}</option>`).join('');
    const names=()=>ct.value==='Currency'?Object.keys(RATES):ct.value==='Temperature'?['°C','°F','K']:Object.keys(UNITS[ct.value]);
    const calc2=()=>{const v=parseFloat(inp.value);if(isNaN(v)){res.textContent='—';return}
      let r;const a=cf.value,b=cto.value,c=ct.value;
      if(c==='Currency')r=v/RATES[a]*RATES[b];
      else if(c==='Temperature'){const C=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?C:b==='°F'?C*9/5+32:C+273.15}
      else r=v*UNITS[c][a]/UNITS[c][b];
      res.textContent=r.toLocaleString('en',{maximumFractionDigits:6})+' '+b};
    const fill=()=>{const n=names(),h=n.map(x=>`<option>${x}</option>`).join('');cf.innerHTML=h;cto.innerHTML=h;cto.selectedIndex=Math.min(1,n.length-1);cn.textContent=ct.value==='Currency'?(ratesLive?'Live rates':'Approx. rates (offline)'):'';calc2()};
    ct.onchange=fill;inp.oninput=calc2;cf.onchange=calc2;cto.onchange=calc2;
    $('.sw',main).onclick=()=>{const t=cf.value;cf.value=cto.value;cto.value=t;calc2()};
    fill();
    if(!ratesLive)fetch('https://api.frankfurter.app/latest?from=USD').then(r=>r.json()).then(j=>{Object.assign(RATES,j.rates);ratesLive=true;if(ct.isConnected&&ct.value==='Currency')fill()}).catch(()=>{});
  }
  w.addEventListener('keydown',evn=>{if(mode==='conv')return;const m={'/':'÷','*':'×','-':'−',Enter:'=',Backspace:'⌫',Escape:'C'};const k=m[evn.key]||evn.key;if('0123456789.+%()^!'.includes(k)||['÷','×','−','=','⌫','C'].includes(k)){evn.preventDefault();press(k)}});
  w.tabIndex=0;w.style.outline='none';
  setMode('basic');
}

/* ---------- Browser ---------- */
const DDG0="https://holy-firefly-982c.fert0480.workers.dev";
const EP=()=>(LS.get('wos:ddg','')||DDG0).replace(/\/$/,'');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resolve(v){
  v=v.trim();if(!v)return'chrome://newtab';
  if(/^(chrome|about):/.test(v))return v.replace(/^about:/,'chrome://');
  const h=v.replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(!/\s/.test(v)&&/\./.test(h))return h;
  return 'chrome://search?q='+encodeURIComponent(v);
}
function render(url){
  if(url==='chrome://newtab'||url.startsWith('chrome://')&&!url.startsWith('chrome://search'))return{t:'New tab',h:`<div class="center"><div class="logo"><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span></div><input class="sb" data-sb placeholder="Search or enter a URL" aria-label="Search"></div>`};
  if(url.startsWith('chrome://search')){const q=decodeURIComponent(url.split('q=')[1]||'');return{t:q+' - Search',h:`<div class="pad"><div id="ddgbox"></div></div>`}}
  const s=/^https?:/.test(url)?url:'https://'+url;
  return{t:url.replace(/^https?:\/\//,'').slice(0,40),h:`<div class="fr"><div class="ld">Loading…</div><iframe src="${esc(s)}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-presentation"></iframe></div>`};
}
function browser(root,w){
  root.innerHTML=`<div class="tabs"></div><div class="nav"><button aria-label="Back">←</button><button aria-label="Forward">→</button><button aria-label="Reload">⟳</button><input class="omni" placeholder="Search the web or enter a URL" aria-label="Address bar"></div><div class="page"></div>`;
  const tabsEl=$('.tabs',root),om=$('.omni',root),page=$('.page',root),[back,fwd,rl]=root.querySelectorAll('.nav>button');
  let tabs=[],cur=0;
  const T=()=>tabs[cur],U=()=>T().h[T().i];
  async function ddg(u){
    const q=decodeURIComponent(u.split('q=')[1]||''),box=$('#ddgbox',page);if(!box)return;
    box.innerHTML='<small style="color:var(--mute)">Searching…</small>';
    try{
      const r=await fetch(EP()+'/?q='+encodeURIComponent(q)),j=await r.json();
      if(j.error)throw 0;
      box.innerHTML=(j.organic_results||[]).map(x=>`<div class="res"><a data-go="${esc(x.link||'')}">${esc(x.title||x.link||'')}</a><small>${esc(x.displayed_link||x.link||'')}</small>${esc(x.snippet||'')}</div>`).join('')||'<small style="color:var(--mute)">No results.</small>';
    }catch{box.innerHTML='<small style="color:var(--mute)">Could not search right now. Check your connection and try again.</small>'}
  }
  function newTab(u='chrome://newtab'){tabs.push({h:[u],i:0});cur=tabs.length-1;draw()}
  function go(v){const u=resolve(v),t=T();t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i++;draw()}
  function draw(){
    tabsEl.innerHTML='';
    tabs.forEach((t,i)=>{const d=document.createElement('div');d.className='tab'+(i===cur?' on':'');
      const r=render(t.h[t.i]);
      d.innerHTML=`<span>${esc(r.t)}</span><button aria-label="Close pestaña">✕</button>`;
      d.onclick=e=>{if(e.target.tagName==='BUTTON'){tabs.splice(i,1);if(!tabs.length)return newTab();cur=Math.min(cur,tabs.length-1)}else cur=i;draw()};
      tabsEl.appendChild(d)});
    const p=document.createElement('button');p.className='plus';p.textContent='+';p.setAttribute('aria-label','New tab');p.onclick=()=>newTab();tabsEl.appendChild(p);
    const u=U(),r=render(u);
    page.innerHTML=r.h;page.scrollTop=0;
    const f=$('iframe',page);if(f)f.onload=()=>{const l=$('.ld',page);if(l)l.remove()};
    if(u.startsWith('chrome://search'))ddg(u);
    om.value=/^chrome:\/\/(newtab)?$/.test(u)?'':(/^chrome:/.test(u)?u:(/^https?:/.test(u)?u:'https://'+u));
    back.disabled=T().i===0;fwd.disabled=T().i>=T().h.length-1;
    const sb=$('[data-sb]',page);if(sb)sb.onkeydown=e=>{if(e.key==='Enter')go(sb.value)};
  }
  page.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
  om.addEventListener('keydown',e=>{if(e.key==='Enter'){go(om.value);om.blur()}});
  om.addEventListener('focus',()=>om.select());
  back.onclick=()=>{T().i--;draw()};fwd.onclick=()=>{T().i++;draw()};rl.onclick=draw;
  newTab();
}

/* ---------- YouTube ---------- */
function youtube(root){
  const YTKEY='AIzaSyCcwFsoTOMku6Lh1lsCB1sUJCngP0sYcY4';
  root.innerHTML=`<div class="yt"><div class="yh"><input placeholder="Search YouTube or paste a link" aria-label="Search videos"><button>Search</button></div><div class="yb"><div class="ym">Loading trending…</div></div></div>`;
  const inp=$('input',root),yb=$('.yb',root),HOME='<div class="ym">Search for a video or paste a YouTube link.</div>';let last=null;
  const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
  const vid=s=>{const m=s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/)||s.match(/^([\w-]{11})$/);return m&&m[1]};
  const grid=items=>{yb.innerHTML='<div class="yg"></div>';const g=$('.yg',yb);items.forEach(it=>{const b=document.createElement('button');b.className='yc';const im=new Image();im.src=it.thumb;im.alt='';im.loading='lazy';const t=document.createElement('b'),c=document.createElement('small');t.textContent=dec(it.title);c.textContent=dec(it.channel)+(it.views?' · '+it.views:'');b.append(im,t,c);b.onclick=()=>play(it.id);g.appendChild(b)})};
  function play(id){yb.innerHTML='<button class="ybk">← Results</button><div class="yp"><iframe allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';$('iframe',yb).src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';$('.ybk',yb).onclick=()=>{if(last)grid(last);else yb.innerHTML=HOME}}
  const mapSearch=j=>(j.items||[]).filter(x=>x.id&&(x.id.videoId||typeof x.id==='string')).map(x=>{
    const id=x.id.videoId||x.id;const sn=x.snippet||{};
    return{id,title:sn.title||'',channel:sn.channelTitle||'',thumb:(sn.thumbnails&&(sn.thumbnails.medium||sn.thumbnails.high||sn.thumbnails.default)||{}).url||''};
  });
  const mapVideos=j=>(j.items||[]).map(x=>{
    const sn=x.snippet||{},st=x.statistics||{};
    const v=st.viewCount?Number(st.viewCount).toLocaleString('en')+' views':'';
    return{id:x.id,title:sn.title||'',channel:sn.channelTitle||'',thumb:(sn.thumbnails&&(sn.thumbnails.medium||sn.thumbnails.high||sn.thumbnails.default)||{}).url||'',views:v};
  });
  async function ytApi(path,params){
    const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
    u.searchParams.set('key',YTKEY);
    Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
    const r=await fetch(u);const j=await r.json();
    if(j.error)throw new Error((j.error.message||'API error')+(j.error.errors&&j.error.errors[0]?' ('+j.error.errors[0].reason+')':''));
    return j;
  }
  async function loadTrending(){

async function localAI(b,sig){
  const json=(o,s=200)=>new Response(JSON.stringify(o),{status:s,headers:{'content-type':'application/json'}});
  if(!navigator.gpu)return json({error:{message:'This browser has no WebGPU, so Gemma cannot run here.'}},500);
  try{
    if(!EN){
      const W=await import('https://esm.run/@mlc-ai/web-llm');
      const cb=p=>say('Loading Gemma… '+Math.round((p.progress||0)*100)+'% (first time only)');
      for(const id of LOCAL[b.model]){try{EN=await W.CreateMLCEngine(id,{initProgressCallback:cb});break}catch(e){EN=null}}
      if(!EN)throw new Error('Could not load Gemma on this device.');
    }
    if(sig)sig.addEventListener('abort',()=>EN&&EN.interruptGenerate());
    const msgs=b.messages.map(m=>({role:m.role,content:Array.isArray(m.content)?m.content.filter(x=>x.type==='text').map(x=>x.text).join('\n'):m.content}));
    const r=await EN.chat.completions.create({messages:msgs,max_tokens:1024});
    return json({content:[{type:'text',text:r.choices[0].message.content}]});
  }catch(e){return json({error:{message:String(e&&e.message||e)}},500)}
}

      m={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),user:S.user||'_g',type,blob,ts:+d,
        name:({photo:'foto',video:'video',audio:'audio'})[type]+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.'+ext};
    await mSave(m);if(dl.checked)dlf(m);draw()};
  rb.onclick=()=>{
    if(!st)return start();
    if(mode==='photo'){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>b&&save(b,'photo'),'image/jpeg',.92);return}
    if(rec){rec.stop();return}
    const ch=[],md=mode;rec=new MediaRecorder(st);rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    rec.onstop=()=>{const t=rec.mimeType;rec=null;rb.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>';save(new Blob(ch,{type:t}),md)};rec.start();rb.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>'};
  mb.forEach(b=>b.onclick=()=>{if(rec)rec.stop();mode=b.dataset.m;mb.forEach(x=>x.classList.toggle('on',x===b));start()});
  const iv=setInterval(()=>{if(!root.isConnected){stop();clearInterval(iv);urls.forEach(u=>URL.revokeObjectURL(u))}},1000);
  start();draw();
}

      if(!L.length)ml.innerHTML='<div class="ym">No results.</div>'}
    catch{ml.innerHTML='<div class="ym">Could not search. Check your connection.</div>'}};
  $('.yh button',root).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
  $('[data-f]',root).onclick=async()=>{const s=L[cur];if(!s)return;au.pause();fr.textContent='Searching en YouTube…';

    catch{fr.textContent='Could not load full version.'}};
  $('[data-l]',root).onclick=async()=>{const s=L[cur];if(!s)return;ly.textContent='Fetching lyrics…';
    try{const d=await(await fetch('https://lrclib.net/api/get?artist_name='+encodeURIComponent(s.artistName)+'&track_name='+encodeURIComponent(s.trackName))).json();ly.textContent=d.plainLyrics||'No lyrics.'}catch{ly.textContent='No lyrics.'}};

/* ---- Daily world wallpaper (Bing) ---- */
(function(){
  const key='wos:wall:'+new Date().toISOString().slice(0,10);
  const apply=(url)=>{
    const d=document.getElementById('desk');
    if(!d)return;
    d.style.backgroundImage='url('+url+')';
    d.style.backgroundSize='cover';
    d.style.backgroundPosition='center';
    d.style.backgroundRepeat='no-repeat';
  };
  try{
    const c=localStorage.getItem(key);
    if(c){apply(c);return}
  }catch(e){}
  // Bing daily image JSON (public CORS-friendly mirror)
  fetch('https://bing.biturl.top/?resolution=1920&format=json&index=0&mkt=en-US')
    .then(r=>r.json()).then(j=>{
      const u=j&& (j.url||j.image)||'';
      if(u){try{localStorage.setItem(key,u)}catch(e){} apply(u)}
    }).catch(()=>{
      // fallback NASA APOD
      fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY')
        .then(r=>r.json()).then(j=>{if(j&&j.url&&j.media_type==='image'){try{localStorage.setItem(key,j.url)}catch(e){} apply(j.url)}}).catch(()=>{});
    });
})();
