<style>

<body>
<div id="desk">
  <div class="icons">
    <button class="ico" data-app="calc"><i data-ic="calc"></i>Calculadora</button>
    <button class="ico" data-app="browser"><i data-ic="browser"></i>Navegador</button>

  </div>
</div>
<div id="menu"><div class="lh"><input id="lq" placeholder="Buscar aplicaciones" aria-label="Buscar aplicaciones"></div><div id="apps">
  <button data-app="calc"><span class="mi" data-ic="calc"></span>Calculadora</button>
  <button data-app="browser"><span class="mi" data-ic="browser"></span>Navegador</button>
  <button data-app="ai"><span class="mi" data-ic="ai"></span>IA</button>
  </div><div class="lf"><button id="uinfo"></button><button id="theme">🌓 Tema</button></div>
</div>
<div id="task">
  <button class="tb" id="start" aria-label="Aplicaciones (Tab)">⊞</button><div id="pins"></div>
  <div id="tbs" style="display:flex;gap:6px;overflow-x:auto"></div>
  <div id="clock"></div><button id="prof" aria-label="Perfil"></button>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const desk=$('#desk'),tbs=$('#tbs');
const IC={
calc:'<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#2b2f36"/><rect x="8" y="8" width="32" height="12" rx="3" fill="#9be7a5"/><g fill="#f1f3f4"><circle cx="14" cy="28" r="3.2"/><circle cx="24" cy="28" r="3.2"/><circle cx="34" cy="28" r="3.2" fill="#ff9f43"/><circle cx="14" cy="38" r="3.2"/><circle cx="24" cy="38" r="3.2"/><circle cx="34" cy="38" r="3.2" fill="#ff9f43"/></g></svg>',
browser:'<div style="background:#fff;display:grid;place-items:center"><div style="width:72%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from -60deg,#ea4335 0 120deg,#fbbc05 120deg 240deg,#34a853 240deg);display:grid;place-items:center"><div style="width:42%;aspect-ratio:1;border-radius:50%;background:#4285f4;box-shadow:0 0 0 12% #fff;outline:3px solid #fff"></div></div></div>',
ai:'<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#d97757"/><g stroke="#faf6f0" stroke-width="3.4" stroke-linecap="round">'+[...Array(12)].map((_,i)=>{const a=i*Math.PI/6,r=i%2?11:15;return `<line x1="${24+4*Math.cos(a)}" y1="${24+4*Math.sin(a)}" x2="${24+r*Math.cos(a)}" y2="${24+r*Math.sin(a)}"/>`}).join('')+'</g></svg>'};
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=IC[e.dataset.ic]);
IC.yt='<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#fff"/><rect x="6" y="12" width="36" height="24" rx="8" fill="#ff0033"/><path d="M20 18l10 6-10 6z" fill="#fff"/></svg>';
let z=10,n=0;const wins={};
const small=()=>innerWidth<700;

function openApp(app){
  const id='w'+(++n),w=document.createElement('div');
  w.className='win';w.id=id;
  const W=Math.min(innerWidth-20,app==='calc'?340:860),H=Math.min(innerHeight-90,app==='calc'?640:560);
  w.style.cssText=`width:${W}px;height:${H}px;left:${Math.max(10,(innerWidth-W)/2+n*18-40)}px;top:${50+n*18}px;z-index:${++z}`;
  const name='<span class="mi">'+IC[app]+'</span> '+{calc:'Calculadora',browser:'Navegador',ai:'IA',yt:'YouTube'}[app];
  w.innerHTML=`<div class="title"><b style="display:flex;align-items:center;gap:8px">${name}</b><button class="wb" data-a="min" aria-label="Minimizar">–</button><button class="wb" data-a="max" aria-label="Maximizar">▢</button><button class="wb x" data-a="x" aria-label="Cerrar">✕</button></div><div class="body"></div>`;
  desk.appendChild(w);
  const tb=document.createElement('button');tb.className='tb';tb.innerHTML=name;tbs.appendChild(tb);
  wins[id]={w,tb};
  if(small())w.classList.add('max');
  tb.onclick=()=>{ if(w.classList.contains('min')){w.classList.remove('min');focus(id)} else if(w.style.zIndex==z){w.classList.add('min');tb.classList.remove('on')} else focus(id)};
  w.addEventListener('pointerdown',()=>focus(id));
  w.querySelector('.title').addEventListener('click',e=>{
    const a=e.target.dataset.a;if(!a)return;
    if(a==='x'){w.remove();tb.remove();delete wins[id]}
    if(a==='min'){w.classList.add('min');tb.classList.remove('on')}
    if(a==='max')w.classList.toggle('max');
  });
  drag(w);
  ({calc,browser,ai,yt:youtube})[app]($('.body',w),w);
  focus(id);
}
function focus(id){
  Object.values(wins).forEach(o=>o.tb.classList.remove('on'));
  const o=wins[id];if(!o)return;
  o.w.style.zIndex=++z;o.tb.classList.add('on');
}
function drag(w){
  const t=$('.title',w);let sx,sy,ox,oy,on=false;
  t.addEventListener('pointerdown',e=>{
    if(e.target.dataset.a||w.classList.contains('max'))return;
    on=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;t.setPointerCapture(e.pointerId)});
  t.addEventListener('pointermove',e=>{if(!on)return;
    w.style.left=ox+e.clientX-sx+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px'});
  t.addEventListener('pointerup',()=>on=false);
  t.addEventListener('dblclick',e=>{if(!e.target.dataset.a)w.classList.toggle('max')});
}
document.addEventListener('click',e=>{
  const pn=e.target.closest('[data-pin]');if(pn){const D=S.d,k=pn.dataset.k,a=pn.dataset.pin;D[k]=D[k].includes(a)?D[k].filter(x=>x!==a):[...D[k],a];save();rend();return}
  const b=e.target.closest('[data-app]');
  if(b){openApp(b.dataset.app);$('#menu').classList.remove('show');return}
  if(e.target.closest('#start')){tog();return}
  if(e.target.closest('#prof,#uinfo')){acct();return}
  if(e.target.id==='menu')$('#menu').classList.remove('show');
});
$('#theme').onclick=()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark'};
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('es',{day:'numeric',month:'short'})}
tick();setInterval(tick,20000);

/* ---------- Calculadora ---------- */
const RATES={USD:1,EUR:.92,MXN:18,GBP:.78,JPY:150,CAD:1.36,BRL:5.4,COP:4000,ARS:1000};let ratesLive=false;
const UNITS={Longitud:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},Peso:{kg:1,g:.001,lb:.45359237,oz:.028349523},Volumen:{L:1,mL:.001,gal:3.785411784,taza:.2365882365}};
const FACT=n=>{n=Math.round(n);if(n<0||n>170)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
function calc(root,w){
  root.innerHTML='<div class="calc"><div class="cm"><button class="mb"></button><div class="mmenu"></div></div><div class="cmain"></div></div>';
  const mb=$('.mb',root),mm=$('.mmenu',root),main=$('.cmain',root);
  let mode='basic',e='',fresh=false,deg=true,hist,out;
  const NAMES={basic:'Básica',sci:'Científica',conv:'Convertir'};
  function setMode(m){mode=m;mb.textContent=NAMES[m]+' ▾';mm.classList.remove('show');if(m==='conv')conv();else pad()}
  mb.onclick=()=>{mm.innerHTML=Object.keys(NAMES).map(k=>`<button data-m="${k}"><span>${mode===k?'✓':''}</span><i>${{basic:'±',sci:'ƒ',conv:'⇄'}[k]}</i>${NAMES[k]}</button>`).join('');mm.classList.toggle('show')};
  mm.onclick=ev=>{const b=ev.target.closest('[data-m]');if(b)setMode(b.dataset.m)};
  function ev(s){
    let x=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/\be\b/g,'Math.E').replace(/√\(/g,'Math.sqrt(').replace(/sin\(/g,'SIN(').replace(/cos\(/g,'COS(').replace(/tan\(/g,'TAN(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/(\d+(?:\.\d+)?)!/g,'FACT($1)').replace(/%/g,'/100').replace(/\^/g,'**');
    const o=(x.match(/\(/g)||[]).length,c=(x.match(/\)/g)||[]).length;x+=')'.repeat(Math.max(0,o-c));
    if(!/^[\d+\-*/.()\s]*$/.test(x.replace(/Math\.(PI|E|sqrt|log10|log)|SIN|COS|TAN|FACT/g,'')))throw 0;
    const k=deg?Math.PI/180:1;
    return Function('SIN','COS','TAN','FACT','"use strict";return('+x+')')(a=>Math.sin(a*k),a=>Math.cos(a*k),a=>Math.tan(a*k),FACT);
  }
  const OP=['÷','×','−','+','^','%','!','x²','1/x','=','⌫','±','C'];
  function press(k){
    if(fresh&&!OP.includes(k))e='';
    fresh=false;
    if(k==='C'){e='';hist.textContent=''}
    else if(k==='⌫')e=e.slice(0,-1);
    else if(k==='±'){const m=e.match(/(-?[\d.]+)$/);if(m)e=e.slice(0,m.index)+(m[1][0]==='-'?m[1].slice(1):'-'+m[1])}
    else if(k==='x²')e+='^2';
    else if(k==='1/x'){if(e)e='1/('+e+')'}
    else if(k==='='){if(!e)return;try{let r=ev(e);if(!isFinite(r))throw 0;r=+r.toPrecision(12);hist.textContent=e+' =';e=String(r);fresh=true}catch{hist.textContent=e;e='Error';fresh=true}}
    else{
      if('÷×−+'.includes(k)&&(!e||e==='Error')&&k!=='−')return;
      if('÷×−+'.includes(k)&&'÷×−+'.includes(e.slice(-1)))e=e.slice(0,-1);
      if(e==='Error')e='';
      e+=k;
    }
    out.textContent=e||'0';
  }
  function pad(){
    main.innerHTML='<div class="disp"><small></small><div>0</div></div>'+(mode==='sci'?'<div class="sci"></div>':'')+'<div class="keys"></div>';
    hist=$('small',main);out=$('.disp div',main);
    const keys=$('.keys',main);
    ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].forEach(k=>{const b=document.createElement('button');b.textContent=k;if('C⌫%÷×−+'.includes(k))b.className='op';if(k==='=')b.className='eq';b.onclick=()=>press(k);keys.appendChild(b)});
    if(mode==='sci'){const s=$('.sci',main);['Deg','sin(','cos(','tan(','!','π','e','log(','ln(','x²','(',')','√(','^','1/x'].forEach(k=>{const b=document.createElement('button');b.textContent=k==='Deg'?(deg?'Deg':'Rad'):k;b.onclick=()=>{if(k==='Deg'){deg=!deg;b.textContent=deg?'Deg':'Rad'}else press(k)};s.appendChild(b)})}
    out.textContent=e||'0';
  }
  function conv(){
    main.innerHTML='<div class="cv"><select class="ct" aria-label="Categoría"></select><input class="cin2" type="number" inputmode="decimal" value="1" aria-label="Cantidad"><select class="cf" aria-label="De"></select><div class="sw">⇅</div><select class="cto" aria-label="A"></select><div class="cres">—</div><small class="cn"></small></div>';
    const ct=$('.ct',main),inp=$('.cin2',main),cf=$('.cf',main),cto=$('.cto',main),res=$('.cres',main),cn=$('.cn',main);
    ct.innerHTML=['Moneda',...Object.keys(UNITS),'Temperatura'].map(c=>`<option>${c}</option>`).join('');
    const names=()=>ct.value==='Moneda'?Object.keys(RATES):ct.value==='Temperatura'?['°C','°F','K']:Object.keys(UNITS[ct.value]);
    const calc2=()=>{const v=parseFloat(inp.value);if(isNaN(v)){res.textContent='—';return}
      let r;const a=cf.value,b=cto.value,c=ct.value;
      if(c==='Moneda')r=v/RATES[a]*RATES[b];
      else if(c==='Temperatura'){const C=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?C:b==='°F'?C*9/5+32:C+273.15}
      else r=v*UNITS[c][a]/UNITS[c][b];
      res.textContent=r.toLocaleString('es',{maximumFractionDigits:6})+' '+b};
    const fill=()=>{const n=names(),h=n.map(x=>`<option>${x}</option>`).join('');cf.innerHTML=h;cto.innerHTML=h;cto.selectedIndex=Math.min(1,n.length-1);cn.textContent=ct.value==='Moneda'?(ratesLive?'Tasas en vivo':'Tasas aproximadas (sin conexión)'):'';calc2()};
    ct.onchange=fill;inp.oninput=calc2;cf.onchange=calc2;cto.onchange=calc2;
    $('.sw',main).onclick=()=>{const t=cf.value;cf.value=cto.value;cto.value=t;calc2()};
    fill();
    if(!ratesLive)fetch('https://api.frankfurter.app/latest?from=USD').then(r=>r.json()).then(j=>{Object.assign(RATES,j.rates);ratesLive=true;if(ct.isConnected&&ct.value==='Moneda')fill()}).catch(()=>{});
  }
  w.addEventListener('keydown',evn=>{if(mode==='conv')return;const m={'/':'÷','*':'×','-':'−',Enter:'=',Backspace:'⌫',Escape:'C'};const k=m[evn.key]||evn.key;if('0123456789.+%()^!'.includes(k)||['÷','×','−','=','⌫','C'].includes(k)){evn.preventDefault();press(k)}});
  w.tabIndex=0;w.style.outline='none';
  setMode('basic');
}

/* ---------- Navegador ---------- */
const DDG0="https://holy-firefly-982c.fert0480.workers.dev";
const EP=()=>(LS.get('wos:ddg','')||DDG0).replace(/\/$/,'');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resolve(v){
  v=v.trim();if(!v)return'chrome://newtab';
  if(/^(chrome|about):/.test(v))return v.replace(/^about:/,'chrome://');
  const h=v.replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(!/\s/.test(v)&&/\./.test(h))return h;
  return 'chrome://search?q='+encodeURIComponent(v);
}
function render(url){
  if(url==='chrome://newtab'||url.startsWith('chrome://')&&!url.startsWith('chrome://search'))return{t:'Nueva pestaña',h:`<div class="center"><div class="logo"><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span></div><input class="sb" data-sb placeholder="Busca o escribe una URL" aria-label="Buscar"></div>`};
  if(url.startsWith('chrome://search')){const q=decodeURIComponent(url.split('q=')[1]||'');return{t:q+' - Búsqueda',h:`<div class="pad"><div id="ddgbox"></div></div>`}}
  const s=/^https?:/.test(url)?url:'https://'+url;
  return{t:url.replace(/^https?:\/\//,'').slice(0,40),h:`<div class="fr"><div class="ld">Cargando…</div><iframe src="${esc(s)}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-presentation"></iframe></div>`};
}
function browser(root,w){
  root.innerHTML=`<div class="tabs"></div><div class="nav"><button aria-label="Atrás">←</button><button aria-label="Adelante">→</button><button aria-label="Recargar">⟳</button><input class="omni" placeholder="Busca en la web o escribe una URL" aria-label="Barra de direcciones"></div><div class="page"></div>`;
  const tabsEl=$('.tabs',root),om=$('.omni',root),page=$('.page',root),[back,fwd,rl]=root.querySelectorAll('.nav>button');
  let tabs=[],cur=0;
  const T=()=>tabs[cur],U=()=>T().h[T().i];
  async function ddg(u){
    const q=decodeURIComponent(u.split('q=')[1]||''),box=$('#ddgbox',page);if(!box)return;
    box.innerHTML='<small style="color:var(--mute)">Buscando…</small>';
    try{
      const r=await fetch(EP()+'/?q='+encodeURIComponent(q)),j=await r.json();
      if(j.error)throw 0;
      box.innerHTML=(j.organic_results||[]).map(x=>`<div class="res"><a data-go="${esc(x.link||'')}">${esc(x.title||x.link||'')}</a><small>${esc(x.displayed_link||x.link||'')}</small>${esc(x.snippet||'')}</div>`).join('')||'<small style="color:var(--mute)">Sin resultados.</small>';
    }catch{box.innerHTML='<small style="color:var(--mute)">No se pudo buscar ahora. Revisa tu conexión e inténtalo de nuevo.</small>'}
  }
  function newTab(u='chrome://newtab'){tabs.push({h:[u],i:0});cur=tabs.length-1;draw()}
  function go(v){const u=resolve(v),t=T();t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i++;draw()}
  function draw(){
    tabsEl.innerHTML='';
    tabs.forEach((t,i)=>{const d=document.createElement('div');d.className='tab'+(i===cur?' on':'');
      const r=render(t.h[t.i]);
      d.innerHTML=`<span>${esc(r.t)}</span><button aria-label="Cerrar pestaña">✕</button>`;
      d.onclick=e=>{if(e.target.tagName==='BUTTON'){tabs.splice(i,1);if(!tabs.length)return newTab();cur=Math.min(cur,tabs.length-1)}else cur=i;draw()};
      tabsEl.appendChild(d)});
    const p=document.createElement('button');p.className='plus';p.textContent='+';p.setAttribute('aria-label','Nueva pestaña');p.onclick=()=>newTab();tabsEl.appendChild(p);
    const u=U(),r=render(u);
    page.innerHTML=r.h;page.scrollTop=0;
    const f=$('iframe',page);if(f)f.onload=()=>{const l=$('.ld',page);if(l)l.remove()};
    if(u.startsWith('chrome://search'))ddg(u);
    om.value=/^chrome:\/\/(newtab)?$/.test(u)?'':(/^chrome:/.test(u)?u:(/^https?:/.test(u)?u:'https://'+u));
    back.disabled=T().i===0;fwd.disabled=T().i>=T().h.length-1;
    const sb=$('[data-sb]',page);if(sb)sb.onkeydown=e=>{if(e.key==='Enter')go(sb.value)};
  }
  page.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
  om.addEventListener('keydown',e=>{if(e.key==='Enter'){go(om.value);om.blur()}});
  om.addEventListener('focus',()=>om.select());
  back.onclick=()=>{T().i--;draw()};fwd.onclick=()=>{T().i++;draw()};rl.onclick=draw;
  newTab();
}

/* ---------- YouTube ---------- */
function youtube(root){
  root.innerHTML=`<div class="yt"><div class="yh"><input placeholder="Buscar en YouTube o pegar un enlace" aria-label="Buscar videos"><button>Buscar</button></div><div class="yb"><div class="ym">Busca un video o pega un enlace de YouTube.</div></div></div>`;
  const inp=$('input',root),yb=$('.yb',root),HOME='<div class="ym">Busca un video o pega un enlace de YouTube.</div>';let last=null;
  const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
  const vid=s=>{const m=s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/)||s.match(/^([\w-]{11})$/);return m&&m[1]};
  const grid=items=>{yb.innerHTML='<div class="yg"></div>';const g=$('.yg',yb);items.forEach(it=>{const b=document.createElement('button');b.className='yc';const im=new Image();im.src=it.thumb;im.alt='';const t=document.createElement('b'),c=document.createElement('small');t.textContent=dec(it.title);c.textContent=dec(it.channel);b.append(im,t,c);b.onclick=()=>play(it.id);g.appendChild(b)})};
  function play(id){yb.innerHTML='<button class="ybk">← Resultados</button><div class="yp"><iframe allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';$('iframe',yb).src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';$('.ybk',yb).onclick=()=>{if(last)grid(last);else yb.innerHTML=HOME}}
  async function go(){const q=inp.value.trim();if(!q)return;const id=vid(q);if(id)return play(id);
    yb.innerHTML='<div class="ym">Buscando…</div>';
    try{const r=await fetch(EP()+'/yt?q='+encodeURIComponent(q)),j=await r.json();if(j.error)throw 0;last=j.items||[];if(last.length)grid(last);else yb.innerHTML='<div class="ym">Sin resultados.</div>'}
    catch{yb.innerHTML='<div class="ym">No se pudo buscar ahora. Puedes pegar el enlace de un video para reproducirlo.</div>'}}
  $('button',root).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
}

/* ---------- IA ---------- */
const MODELS=[['claude-fable-5-1','Fable 5.1','Para tus desafíos más difíciles','complex'],['claude-opus-5-5','Opus 5.5','Para trabajo complejo y tareas cotidianas','complex'],['claude-sonnet-5-5','Sonnet 5.5','Más eficiente para tareas más simples','default'],['claude-haiku-5-5','Haiku 5.5','Más rápido para respuestas rápidas','quick']];
const EFF=['Bajo','Medio','Alto'],EFI={Bajo:'Responde de forma muy breve y directa.',Medio:'',Alto:'Razona con cuidado y responde con detalle y precisión.'};
function ai(root){
  root.innerHTML=`<div class="ai"><div class="ah"><button class="hb" data-a="menu" aria-label="Chats">☰</button><b class="at">Chat nuevo</b><button class="hb" data-a="new" aria-label="Nuevo chat">＋</button></div><div class="am"></div><div class="cmp"><textarea rows="1" placeholder="Chat con Claude" aria-label="Mensaje"></textarea><div class="thumbs"></div><div class="cr"><button class="rb" data-a="att" aria-label="Adjuntar fotos">＋</button><input type="file" accept="image/*" multiple hidden><button class="pill" data-a="mdl"></button><span style="flex:1"></span><button class="rb mic" data-a="mic" aria-label="Dictar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button><button class="rb snd" data-a="send" aria-label="Enviar">↑</button></div></div><div class="drw"><div class="dh"><b>Chats</b><button class="hb" data-a="cl" aria-label="Cerrar">✕</button></div><button class="nw" data-a="new">＋ Chat nuevo</button><div class="cl"></div></div><div class="sheet"></div></div>`;
  const am=$('.am',root),ta=$('textarea',root),th=$('.thumbs',root),pill=$('.pill',root),sd=$('.snd',root),drw=$('.drw',root),cl=$('.cl',root),sh=$('.sheet',root),fi=$('input[type=file]',root),mic=$('[data-a=mic]',root),title=$('.at',root);
  let hist=[],curId=null,busy=false,sample=null,ctl=null,pend=[],model='claude-sonnet-5-5',eff='Medio';
  const cur=()=>S.d.chats.find(c=>c.id===curId);
  const setPill=()=>pill.innerHTML=MODELS.find(m=>m[0]===model)[1]+' <span>'+eff+'</span>';
  const add=(c,t)=>{const d=document.createElement('div');d.className=c;d.textContent=t;am.appendChild(d);am.scrollTop=am.scrollHeight;return d};
  const empty=()=>{am.innerHTML='<div class="empty"><span class="mi">'+IC.ai+'</span><b>¿En qué te ayudo?</b></div>'};
  const I={pin:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M14.5 3.5l6 6-2.5 1-3 3 .5 4-1.5 1.5-3.5-3.5L5 20.5M9 9l-.5-.5 2-2 3-.5"/></svg>',edit:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>',trash:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>'};
  const closeMenu=()=>{const m=$('.ctx',root);if(m)m.remove()};
  function renderList(){cl.innerHTML='';[...S.d.chats].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)).forEach(c=>{const r=document.createElement('div'),b=document.createElement('button'),x=document.createElement('button');b.className='ci'+(c.id===curId?' on':'');b.textContent=(c.pin?'📌 ':'')+c.title;b.dataset.c=c.id;x.className='dx';x.textContent='⋯';x.dataset.k=c.id;x.setAttribute('aria-label','Más opciones');r.append(b,x);r.oncontextmenu=e=>{e.preventDefault();menu(c.id,x)};cl.appendChild(r)})}
  function menu(id,anchor){
    closeMenu();
    const c=S.d.chats.find(x=>x.id===id);if(!c)return;
    const m=document.createElement('div');m.className='ctx';
    m.innerHTML=`<button data-p="pin">${I.pin}<span>${c.pin?'Desfijar':'Fijar'}</span></button><hr><button data-p="ren">${I.edit}<span>Cambiar nombre</span></button><hr><button class="red" data-p="del">${I.trash}<span>Eliminar</span></button>`;
    const ar=anchor.getBoundingClientRect(),rr=root.getBoundingClientRect();
    m.style.top=Math.max(8,Math.min(ar.bottom-rr.top,rr.height-190))+'px';m.style.left='20px';
    m.onclick=e=>{const p=e.target.closest('[data-p]');if(!p)return;e.stopPropagation();closeMenu();
      if(p.dataset.p==='pin'){c.pin=!c.pin;save();renderList()}
      else if(p.dataset.p==='del'){S.d.chats=S.d.chats.filter(x=>x.id!==id);save();if(id===curId){if(S.d.chats.length)load(S.d.chats[0].id);else newChat()}else renderList()}
      else{const row=[...cl.querySelectorAll('.ci')].find(b=>b.dataset.c===id);if(!row)return;const inp=document.createElement('input');inp.value=c.title;inp.className='ci rn';row.replaceWith(inp);inp.focus();inp.select();
        inp.onblur=()=>{const v=inp.value.trim();if(v){c.title=v.slice(0,40);save();if(id===curId)title.textContent=c.title}renderList()};
        inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value='';inp.blur()}}}};
    $('.ai',root).appendChild(m);
  }
  function load(id){if(ctl)ctl.abort();busy=false;sd.disabled=false;curId=id;const c=cur();hist=c.msgs;if(c.model&&MODELS.some(m=>m[0]===c.model))model=c.model;eff=c.eff||eff;title.textContent=c.title;am.innerHTML='';if(!hist.length)empty();hist.forEach(m=>add(m.role==='user'?'u':'a',m.content));setPill();renderList()}
  function newChat(){const c={id:'c'+Date.now(),title:'Chat nuevo',model,eff,msgs:[]};S.d.chats.unshift(c);save();load(c.id);drw.classList.remove('open')}
  function sheet(){sh.innerHTML=`<div class="sh"><button class="hb" data-a="xs" aria-label="Cerrar">✕</button><b>Seleccionar modelo</b><span style="width:38px"></span></div><div class="card">${MODELS.map(m=>`<button class="mo" data-m="${m[0]}"><span><b>${m[1]}</b><small>${m[2]}</small></span>${m[0]===model?'<i>✓</i>':''}</button>`).join('')}</div><div class="card"><button class="mo" data-e="1"><b>Esfuerzo</b><small>${eff} ›</small></button></div>`;sh.classList.add('show')}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)mic.style.display='none';
  let rec=null;
  function dictate(){if(rec){rec.stop();return}try{rec=new SR();rec.lang='es-ES';let got=false;rec.onresult=e=>{got=true;ta.value+=(ta.value?' ':'')+e.results[0][0].transcript};rec.onerror=()=>{rec=null;mic.classList.remove('rec')};rec.onend=()=>{rec=null;mic.classList.remove('rec');if(got)go()};rec.start();mic.classList.add('rec')}catch{rec=null}}
  root.onclick=e=>{
    if(!e.target.closest('.ctx'))closeMenu();const t=e.target.closest('[data-a],[data-m],[data-e],[data-c],[data-k]');if(!t)return;
    const a=t.dataset.a,D=t.dataset;
    if(a==='menu'){renderList();drw.classList.add('open')}
    else if(a==='cl')drw.classList.remove('open');
    else if(a==='new')newChat();
    else if(a==='att')fi.click();
    else if(a==='mdl')sheet();
    else if(a==='xs')sh.classList.remove('show');
    else if(a==='send')go();
    else if(a==='mic')dictate();
    else if(D.m){model=D.m;const c=cur();if(c)c.model=model;save();setPill();sh.classList.remove('show')}
    else if(D.e){eff=EFF[(EFF.indexOf(eff)+1)%3];const c=cur();if(c)c.eff=eff;save();setPill();sheet()}
    else if(D.c){load(D.c);drw.classList.remove('open')}
    else if(D.k)menu(D.k,t);
  };
  fi.onchange=()=>{pend.push(...fi.files);fi.value='';th.innerHTML='';pend.forEach(b=>{const i=new Image();i.src=URL.createObjectURL(b);th.appendChild(i)})};
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}};
  async function go(){
    const q=ta.value.trim()||(pend.length?'Describe la imagen.':'');
    if(!q||busy)return;
    const c=cur(),mine=hist;
    ta.value='';ta.style.height='';busy=true;sd.disabled=true;c.model=model;c.eff=eff;
    if(!mine.length){am.innerHTML='';c.title=q.slice(0,30);title.textContent=c.title;renderList()}
    mine.push({role:'user',content:q});
    const ub=add('u',q),imgs=pend.splice(0);th.innerHTML='';
    if(imgs.length){const g=document.createElement('div');g.className='thumbs';imgs.forEach(b=>{const i=new Image();i.src=URL.createObjectURL(b);g.appendChild(i)});ub.appendChild(g)}
    const out=add('a','…');
    const pre='Eres un asistente dentro de un sistema operativo web. Responde en el idioma del usuario.'+(EFI[eff]?' '+EFI[eff]:'');
    const input=mine.map((m,i)=>i===0?{role:m.role,content:pre+'\n\n'+m.content}:m);
    ctl=new AbortController();
    try{
      const r=await sample(input,{model,modelTier:MODELS.find(x=>x[0]===model)[3],...(imgs.length?{images:imgs}:{}),cache:false,signal:ctl.signal,onText:({text})=>{out.textContent=text;am.scrollTop=am.scrollHeight}});
      out.textContent=r.text;mine.push({role:'assistant',content:r.text});save();
    }catch(e){out.className='e';out.textContent=(e&&e.message)||'No se pudo obtener respuesta.';mine.pop()}
    if(mine===hist){busy=false;sd.disabled=false}
  }
  if(S.d.chats.length)load(S.d.chats[0].id);else newChat();
  const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
  let real=null;
  sample=async(input,o)=>{
    if(real)return real(input,o);
    const msgs=input.map(m=>({role:m.role,content:m.content}));
    if(o.images&&o.images.length){const last=msgs[msgs.length-1];last.content=[...await Promise.all(o.images.map(async b=>({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await b64(b)}}))),{type:'text',text:last.content}]}
    const r=await fetch(EP()+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:o.model,messages:msgs}),signal:o.signal});
    const j=await r.json();if(!r.ok||j.error)throw {message:(j.error&&j.error.message)||j.error||'Error del servidor'};
    return {text:(j.content||[]).map(x=>x.text||'').join('')};
  };
  if(window.claude)claude.use('sample').then(s=>{real=s}).catch(()=>{});
}

/* ---------- Sistema: cuentas, apps, lanzador ---------- */
const APPS={calc:'Calculadora',browser:'Navegador',ai:'IA',yt:'YouTube'};
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S={user:null,d:null};
const defD=()=>({pins:['calc','browser','ai','yt'],desk:['calc','browser','ai','yt'],chats:[]});
const save=()=>LS.set('wos:u:'+(S.user||'_g'),S.d);
const H=async(u,p)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function loadU(u){S.user=u;S.d=LS.get('wos:u:'+(u||'_g'),null)||defD();['pins','desk'].forEach(k=>S.d[k]=(S.d[k]||[]).filter(a=>APPS[a]));S.d.chats=S.d.chats||[];if(!S.d.v2){S.d.v2=1;['pins','desk'].forEach(k=>{if(!S.d[k].includes('yt'))S.d[k].push('yt')});save()}LS.set('wos:cur',u);rend()}
function sw(u){Object.keys(wins).forEach(k=>{wins[k].w.remove();wins[k].tb.remove();delete wins[k]});loadU(u)}
function tiles(){const f=($('#lq').value||'').toLowerCase(),D=S.d;
  $('#apps').innerHTML=Object.keys(APPS).filter(a=>APPS[a].toLowerCase().includes(f)).map(a=>`<div class="tl" draggable="true" data-d="${a}"><button data-app="${a}"><span class="mi">${IC[a]}</span>${APPS[a]}</button><div class="pb"><button data-pin="${a}" data-k="pins" class="${D.pins.includes(a)?'on':''}">Barra</button><button data-pin="${a}" data-k="desk" class="${D.desk.includes(a)?'on':''}">Inicio</button></div></div>`).join('')}
function rend(){const D=S.d,nm=S.user||'Invitado';
  $('.icons').innerHTML=D.desk.map(a=>`<button class="ico" data-app="${a}"><i>${IC[a]}</i>${APPS[a]}</button>`).join('');
  $('#pins').innerHTML=D.pins.map(a=>`<button data-app="${a}" title="${APPS[a]}" aria-label="${APPS[a]}"><span class="mi">${IC[a]}</span></button>`).join('');
  $('#desk').style.background=D.bg||'';tiles();$('#prof').textContent=nm[0].toUpperCase();$('#uinfo').textContent='👤 '+nm}
function tog(){const m=$('#menu');m.classList.toggle('show');if(m.classList.contains('show')){$('#lq').value='';tiles();$('#lq').focus()}}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+h+'</div>';document.body.appendChild(m);return m}
function acct(){
  const m=modal(S.user?`<b>${esc(S.user)}</b><button data-x="sw">Cambiar de cuenta</button><button data-x="out">Cerrar sesión</button>`:`<b>Invitado</b><button class="pri" data-x="sw">Iniciar sesión o crear cuenta</button>`);
  m.onclick=e=>{const x=e.target.dataset.x;if(e.target===m||x)m.remove();if(x==='sw')authUI();if(x==='out')sw(null)};
}
function authUI(mode='in'){
  const up=mode==='up',m=document.createElement('div');m.className='auth';
  m.innerHTML=`<button class="ax" aria-label="Cerrar">✕</button><div class="ab"><div class="lg">Web<span>OS</span></div><h2>${up?'Crea tu cuenta':'Bienvenido de nuevo'}</h2><p>${up?'Regístrate para guardar tus chats.':'Inicia sesión para guardar tus chats.'}</p><input id="au" placeholder="Usuario" autocomplete="username" autocapitalize="none"><input id="ap" type="password" placeholder="Contraseña" autocomplete="${up?'new-password':'current-password'}">${up?'<input id="ac" type="password" placeholder="Confirmar contraseña" autocomplete="new-password">':''}<small id="am">Las cuentas se guardan solo en este dispositivo.</small><button class="go">${up?'Registrarme':'Iniciar sesión'}</button><a class="sw">${up?'¿Ya tienes cuenta? Inicia sesión':'¿Necesitas una cuenta? Regístrate'}</a></div>`;
  document.body.appendChild(m);
  const ok=async()=>{
    const u=$('#au',m).value.trim().toLowerCase(),p=$('#ap',m).value,msg=$('#am',m),U=LS.get('wos:users',{});
    if(!/^[a-z0-9_]{2,20}$/.test(u)||p.length<4){msg.textContent='Usuario: 2-20 letras, números o _. Contraseña: mínimo 4.';return}
    if(up&&$('#ac',m).value!==p){msg.textContent='Las contraseñas no coinciden.';return}
    let h;try{h=await H(u,p)}catch{msg.textContent='Tu navegador no permite crear cuentas aquí.';return}
    if(up){if(U[u]){msg.textContent='Ese usuario ya existe.';return}U[u]=h;LS.set('wos:users',U)}
    else if(U[u]!==h){msg.textContent='Usuario o contraseña incorrectos.';return}
    m.remove();sw(u);
  };
  m.onclick=e=>{if(e.target.closest('.ax'))m.remove();else if(e.target.closest('.sw')){m.remove();authUI(up?'in':'up')}else if(e.target.closest('.go'))ok()};
  m.onkeydown=e=>{if(e.key==='Enter')ok()};
  setTimeout(()=>$('#au',m).focus(),50);
}
addEventListener('keydown',e=>{
  if(e.key==='Escape')$('#menu').classList.remove('show');
  if(e.key==='Tab'&&(e.target.id==='lq'||!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))){e.preventDefault();tog()}
});
$('#lq').oninput=tiles;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-d]');if(!t)return;e.dataTransfer.setData('text/plain',t.dataset.d);setTimeout(()=>$('#menu').classList.add('drag'))});
document.addEventListener('dragend',()=>$('#menu').classList.remove('drag'));
[['desk','desk'],['task','pins']].forEach(([id,k])=>{const el=document.getElementById(id);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const a=e.dataTransfer.getData('text/plain');if(APPS[a]&&!S.d[k].includes(a)){S.d[k].push(a);save();rend()}}});
{const U0=LS.get('wos:users',{}),c0=LS.get('wos:cur',null);loadU(c0&&U0[c0]?c0:null)}
</script>
